<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthFit AI - Upload Report</title>
    <script src="https://cdn.tailwindcss.com"></script>

    </head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-lg w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100">
        <div class="bg-blue-600 p-8 text-center text-white">
            <div class="bg-white/20 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 backdrop-blur-sm">
                <span class="text-3xl">📁</span>
            </div>
            <h2 class="text-2xl font-bold">Upload Medical Report</h2>
            <p class="text-blue-100 mt-1 opacity-90">JPG, PNG or PDF formats supported</p>
        </div>
        
        {% if error %}
        <div class="bg-red-50 text-red-600 p-4 mx-8 mt-6 rounded-xl border border-red-200 text-sm font-semibold flex items-start gap-3">
            <span class="text-xl">⚠️</span>
            <p>{{ error }}</p>
        </div>
        {% endif %}
        
        <form action="/upload" method="post" enctype="multipart/form-data" class="p-8 {% if error %}pt-4{% endif %}">
            <div class="group relative border-2 border-dashed border-slate-300 rounded-3xl p-12 text-center hover:border-blue-500 hover:bg-blue-50/50 transition-all duration-300 cursor-pointer">
                <input type="file" name="file" accept="image/*" required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" id="fileInput" onchange="updateFileName()">
                
                <div id="uploadPlaceholder">
                    <span class="text-5xl block mb-4 group-hover:scale-110 transition-transform">📄</span>
                    <span class="text-slate-500 font-semibold block">Click or Drag to Upload</span>
                    <span class="text-slate-400 text-xs mt-2 block italic">Select a clear image for better AI analysis</span>
                </div>

                <div id="fileNameDisplay" class="hidden">
                    <span class="text-4xl block mb-2">✅</span>
                    <span id="nameLabel" class="text-blue-600 font-bold block truncate px-4">Filename.jpg</span>
                    <span class="text-slate-400 text-xs mt-1 block">File selected successfully</span>
                </div>
            </div>
            
            <button type="submit" class="w-full mt-8 bg-slate-900 hover:bg-black text-white font-bold py-4 rounded-2xl shadow-lg transition duration-300 active:scale-95 flex items-center justify-center gap-2">
                <span>🔍 Start AI Analysis</span>
            </button>
        </form>
        
        <div class="bg-slate-50 p-5 text-center border-t border-slate-100">
            <a href="/" class="text-slate-500 hover:text-blue-600 text-sm font-bold transition flex items-center justify-center gap-1">
                <span class="text-lg">←</span> Back to Dashboard
            </a>
        </div>
    </div>

    <script>
        function updateFileName() {
            const input = document.getElementById('fileInput');
            const placeholder = document.getElementById('uploadPlaceholder');
            const display = document.getElementById('fileNameDisplay');
            const label = document.getElementById('nameLabel');

            if (input.files && input.files.length > 0) {
                placeholder.classList.add('hidden');
                display.classList.remove('hidden');
                label.textContent = input.files[0].name;
            }
        }
    </script>


</body>

</html>
